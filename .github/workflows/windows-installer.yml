name: Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smf-yt-downloader-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Windows EXE
        shell: cmd
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "SMF_YT_Downloader" --collect-all imageio_ffmpeg app.py

      - name: Build installer
        shell: powershell
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\SMF_YT_Downloader.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SMF-YT-Downloader-EXE
          path: dist\SMF_YT_Downloader.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: SMF-YT-Downloader-Installer
          path: installer\output\SMF_YT_Downloader_Setup.exe
